<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#e8ecff;--cyan:#22e6ff;--pink:#ff2bd6;--gold:#ffd23f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:#5fa354;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.bar,.dock,.panel{position:fixed;left:12px;right:12px;max-width:520px;margin:auto;z-index:2}
.bar{top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;gap:8px}
.bar input{flex:1;min-width:0;padding:12px 14px;border-radius:14px;border:1px solid #2c3470;background:#0d1230dd;color:var(--ink);font-size:16px;outline:none}
.bar input:focus{border-color:var(--cyan);box-shadow:0 0 14px #22e6ff88}
button{padding:10px 12px;border:0;border-radius:14px;font-weight:700;font-size:13px;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--pink),#7a5cff);box-shadow:0 0 12px #ff2bd677}
button.alt{background:linear-gradient(135deg,#0aa7c9,#22e6ff);color:#041018;box-shadow:0 0 12px #22e6ff77}
button.gold{background:linear-gradient(135deg,#ff9f1c,var(--gold));color:#201400;box-shadow:0 0 12px #ffd23f88}
button:disabled{opacity:.45}
.wal{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 66px);text-align:center;z-index:1;font-weight:800;font-size:16px;color:var(--gold);text-shadow:0 1px 3px #000c,0 0 10px #ffd23f88;display:none;pointer-events:none}
.wal span{color:#fff;font-weight:600;font-size:13px;margin-left:8px;text-shadow:0 1px 3px #000c}
.hint{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 70px);text-align:center;color:#fff;text-shadow:0 1px 4px #000b;font-size:14px;pointer-events:none;z-index:1;padding:0 16px}
.stat{position:fixed;left:14px;top:calc(env(safe-area-inset-top,0px) + 92px);color:#fff;text-shadow:0 1px 3px #000b;font-size:12px;z-index:1;pointer-events:none}
.dock{bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:none;gap:6px;justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.dock button{flex:none;white-space:nowrap}
.panel{bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding:14px;border-radius:18px;background:#0d1230ee;border:1px solid #2c3470;display:none}
.panel.up{bottom:calc(env(safe-area-inset-bottom,0px) + 72px)}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
a{color:var(--cyan)}
.zm{position:fixed;right:12px;top:42%;display:flex;flex-direction:column;gap:10px;z-index:2}
.zm button{width:48px;height:48px;padding:0;font-size:24px;background:#fff;color:#222;border-radius:14px;box-shadow:0 3px 0 #0003}
.modal{position:fixed;inset:0;background:#030510d9;z-index:5;display:none;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:460px;max-height:86%;overflow:auto;background:#0d1230;border:1px solid #3a44a0;border-radius:20px;padding:16px;box-shadow:0 0 30px #7a5cff55}
.card h3{margin:0 0 6px}
.arena{position:relative;height:300px;border-radius:14px;background:#070a1a;border:1px solid #2c3470;overflow:hidden;margin-top:10px;touch-action:manipulation}
.coin{position:absolute;width:44px;height:44px;border-radius:50%;border:0;padding:0;font-size:22px;background:radial-gradient(circle,#fff3a0,var(--gold));box-shadow:0 0 18px var(--gold)}
.item{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #222a66}
.item small{color:#8b93c4;display:block}
.bigbtn{width:100%;height:120px;font-size:30px;margin-top:10px}
.bar2{height:10px;border-radius:8px;background:#1b2260;margin-top:10px;overflow:hidden}.bar2 i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--pink))}
.tod{position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 92px);color:#fff;text-shadow:0 1px 3px #000b;font-size:13px;font-weight:700;z-index:1;pointer-events:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 150px);max-width:86%;padding:10px 16px;border-radius:14px;background:#0d1230f2;border:1px solid var(--gold);color:#fff;font-weight:700;font-size:14px;z-index:9;display:none;text-align:center;box-shadow:0 0 18px #ffd23f66}
.spark{display:flex;gap:2px;align-items:flex-end;height:22px;margin-top:4px}.spark i{display:block;width:6px;background:#22e6ff;border-radius:2px}.spark i:last-child{background:#ffd23f}
.tabs{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.lb{display:flex;justify-content:space-between;gap:8px;padding:9px 6px;border-bottom:1px solid #222a66;cursor:pointer;border-radius:8px}.lb.me{background:#7a5cff33}
.gh{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 112px);text-align:center;color:#fff;font-weight:700;font-size:13px;text-shadow:0 1px 3px #000c;z-index:1;pointer-events:none;padding:0 12px}

<body>
<canvas id="c"></canvas>
<div class="bar"><input id="u" placeholder="Instagram username (masalan: aziz_01)" maxlength="30" autocapitalize="none" autocomplete="off" spellcheck="false"><button id="go" style="font-size:15px">Uycha</button></div>

  <button class="gold" id="bD">🎁 Sovgʻa</button><button class="alt" id="bL">🏆 Liderlar</button><button id="bT">📨 Taklif</button><button class="gold" id="bK">🎰 Kazino</button><button id="bG">🏎 Gonka</button><button class="alt" id="bB">🏪 Biznes</button><button id="bO">🌾 Ogorod</button><button class="gold" id="bM">🧺 Bozor</button><button id="bQ">🏗 Qurilish</button><button class="alt" id="bX">🔁 Almashtirish</button>
</div>

<script>
(function(){
const cv=document.getElementById('c'),$=id=>document.getElementById(id);let ctx=cv.getContext('2d');const mainCtx=ctx;
const houses=new Map();let links=[],me=null,sel=null,db=null,mode='local',W=0,H=0,DPR=1;
// ---- sozlamalar ----
const CW=320,CH=300,MAH=6,PER=6,N=MAH*PER,WW=4400,WH=4400,CX=WW/2,CY=WH/2,MR=1450,HR=450,RR=600;
const MNAMES=['Chilonzor','Yunusobod','Mirobod','Yakkasaroy','Sergeli','Olmazor'];
const MCEN=[],SLOTS=[];
for(let m=0;m<MAH;m++){const a=m*Math.PI/3-Math.PI/2+.25,mx=CX+MR*Math.cos(a),my=CY+MR*Math.sin(a);MCEN.push({x:mx,y:my});
  for(let j=0;j<PER;j++){const b=j*Math.PI/3+a+5*Math.PI/6,x=mx+HR*Math.cos(b),y=my+HR*Math.sin(b);SLOTS.push({cx:x,top:y-CH/2,m})}}
const MAHLV=[{n:'Favvora',e:'⛲',need:3000},{n:'Haykal',e:'🗽',need:12000},{n:'Aylanma sayr',e:'🎡',need:30000}];
let fund=[0,0,0,0,0,0];
const mlevel=m=>{let l=0;MAHLV.forEach((x,i)=>{if(fund[m]>=x.need)l=i+1});return l};
const mahOf=h=>Math.floor(h.slot/PER);
const fr=a=>{const v=Math.sin(a)*43758.5453;return v-Math.floor(v)};
const TREES=[];for(let i=0;i<300&&TREES.length<130;i++){const x=fr(i*12.9898)*WW,y=fr(i*78.233+3.1)*WH,d=Math.hypot(x-CX,y-CY);
  if(d>2150||d<420||Math.abs(d-RR)<50||Math.abs(d-MR)<0)continue;let bad=false;
  for(const q of SLOTS){if(Math.abs(x-q.cx)<200&&Math.abs(y-(q.top+150))<190){bad=true;break}}
  if(!bad)for(const c of MCEN){if(Math.hypot(x-c.x,y-c.y)<260){bad=true;break}
    const dx=c.x-CX,dy=c.y-CY,L2=dx*dx+dy*dy,pr=((x-CX)*dx+(y-CY)*dy)/L2,px=CX+dx*pr,py=CY+dy*pr;if(pr>0&&pr<1&&Math.hypot(x-px,y-py)<50){bad=true;break}}
  if(!bad)TREES.push({x,y,r:16+(i%5)*3})}
const CAR_COST=5,RATE=10,GARDEN_COST=20,SEED=2,GROW=90,PRICE=10,MULTI=10000,FLOOR=1000,START_FL=3,MAXF=8; // 10 tanga=1 DD, bugʻdoy 1 dona=10 DD
const BIZ={kafe:{n:'Kafe',e:'☕',cost:5000,rate:30,c:'#e8553a'},dokon:{n:'Doʻkon',e:'🛒',cost:12000,rate:80,c:'#2aa876'},servis:{n:'Avtoservis',e:'🔧',cost:30000,rate:220,c:'#2f7de1'},mehmon:{n:'Mehmonxona',e:'🏨',cost:80000,rate:650,c:'#9b59d0'}};
const idOf=u=>u.replace(/\./g,'_'),clean=s=>s.trim().replace(/^@/,'').toLowerCase().replace(/[^a-z0-9._]/g,'').slice(0,30);
const hueOf=u=>{let h=0;for(const c of u)h=(h*31+c.charCodeAt(0))%360;return h};
const pairId=(a,b)=>[a,b].sort().join('__'),r1=n=>Math.round(n*10)/10,fmt=n=>String(r1(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const cellOf=k=>SLOTS[((k%N)+N)%N];
function freeSlot(u){const used=new Set();for(const h of houses.values())if(h.id!==idOf(u))used.add(h.slot);
  let k=0;for(const c of u)k=(k*31+c.charCodeAt(0))%PER;
  for(let m=0;m<MAH;m++)for(let i=0;i<PER;i++){const q=m*PER+(k+i)%PER;if(!used.has(q))return q}return k}
const CROPS={bugdoy:{n:'Bugʻdoy',e:'🌾',seed:2,grow:90,price:10},pomidor:{n:'Pomidor',e:'🍅',seed:4,grow:150,price:22},paxta:{n:'Paxta',e:'🌸',seed:6,grow:240,price:38},uzum:{n:'Uzum',e:'🍇',seed:10,grow:360,price:65}};
const CK=Object.keys(CROPS),RENT=10,PERIOD=60000,DAYMS=600000;
const PERKS={kafe:{item:'Burger',price:15,txt:'Kazinoda tanga x2 (5 daqiqa)'},dokon:{item:'Urugʻ toʻplami',price:40,txt:'8 ta bepul urugʻ'},servis:{item:'Tuning',price:25,txt:'Gonka mukofoti x2 (5 daqiqa)'},mehmon:{item:'Dam olish',price:45,txt:'Ogorod 2x tez (5 daqiqa)'}};
const pmult=(k,i)=>1+.32*Math.sin(k*1.7+i*2.1)+.18*Math.sin(k*.53+i*1.3+1);
const cprice=(c,k)=>Math.max(1,Math.round(CROPS[c].price*pmult(k===undefined?Math.floor(Date.now()/PERIOD):k,CK.indexOf(c))*((k===undefined&&weatherAt(Date.now())==='snow')?1.25:1)));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const toast=(m,ms)=>{const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',ms||2800)};
const WPER=120000;
function weatherAt(t){const k=Math.floor(t/WPER),u=Math.sin(k*12.9898+78.233)*43758.5453,v=u-Math.floor(u);return v<.015?'snow':(v<.165?'rain':'clear')}
const wMult=()=>{const w=weatherAt(Date.now());return w==='rain'?.8:(w==='snow'?1.3:1)};
const growOf=h=>(Date.now()<(h.gb||0)?.5:1)*wMult();
const saleMult=h=>Date.now()<(h.sl||0)?1.25:1;
const hour24=()=>((Date.now()%DAYMS)/DAYMS)*24;
const nightD=()=>{const h=hour24();return (h<5||h>=20)?1:(h<7?1-(h-5)/2:(h>=18?(h-18)/2:0))};
const hexrgb=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16)).join(',');
let lastTod='',lastGh='',lastW='';const tfmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function addTask(x,key,n){const t=(x.tk&&x.tk.d===today())?x.tk:{d:today(),w:0,c:0,g:0,done:[]};t[key]+=n;x.tk=t}
const mult=id=>{const h=houses.get(id);return 1+.1*Math.min(10,links.filter(l=>l.a===id||l.b===id).length)+(h?.05*mlevel(mahOf(h)):0)};

// ---- kamera ----
let lite=false,slowN=0,prevT=0,lastFrame=-100;
let cam={x:CX,y:CY+60,z:.4};
function resize(){DPR=lite?1:Math.min(devicePixelRatio||1,1.25);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR}
function clampCam(){cam.z=Math.max(.2,Math.min(2.4,cam.z));cam.x=Math.max(0,Math.min(WW,cam.x));cam.y=Math.max(0,Math.min(WH,cam.y))}
function home(){const h=M();if(h){const c=cellOf(h.slot);cam.x=c.cx;cam.y=c.top+150;cam.z=Math.max(.8,W/520)}else{cam.x=CX;cam.y=CY+60;cam.z=Math.max(.3,W/1100)}clampCam()}
addEventListener('resize',resize);resize();cam.z=Math.max(.3,W/1100);

// ---- chizish ----
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function poly(pts,fill,stroke){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function drawMahalla(c,m){
  const lv=mlevel(m),t=Date.now(),n=[...houses.values()].filter(h=>mahOf(h)===m).length;
  ctx.save();ctx.textAlign='center';
  ctx.beginPath();ctx.arc(c.x,c.y+20,64,0,7);ctx.fillStyle=lv?'#7ecbf0':'#d9cfae';ctx.fill();ctx.lineWidth=5;ctx.strokeStyle='#fff';ctx.stroke();
  if(lv>=1){const p=(t/900)%1;ctx.beginPath();ctx.arc(c.x,c.y+20,18+p*40,0,7);ctx.lineWidth=3;ctx.strokeStyle='rgba(255,255,255,'+(1-p)+')';ctx.stroke();ctx.font='56px serif';ctx.fillText('⛲',c.x,c.y+40)}
  else{ctx.font='34px serif';ctx.fillText('🏗',c.x,c.y+32)}
  if(lv>=2){ctx.font='64px serif';ctx.fillText('🗽',c.x-112,c.y+30)}
  if(lv>=3){ctx.font='84px serif';ctx.fillText('🎡',c.x+112,c.y+34)}
  ctx.font='700 20px system-ui,sans-serif';const lb='🏘 '+MNAMES[m]+(lv?' · '+lv+'-daraja':''),tw=ctx.measureText(lb).width+28;
  ctx.fillStyle='#fff';rr(c.x-tw/2,c.y-150,tw,34,17);ctx.fill();ctx.fillStyle='#1b1b1b';ctx.fillText(lb,c.x,c.y-127);
  ctx.font='700 15px system-ui,sans-serif';const l2='👥 '+n+' · fond '+fmt(fund[m])+' DD',w2=ctx.measureText(l2).width+22;
  ctx.fillStyle='rgba(255,255,255,.92)';rr(c.x-w2/2,c.y+100,w2,26,13);ctx.fill();ctx.fillStyle='#1b1b1b';ctx.fillText(l2,c.x,c.y+119);
  ctx.restore()}
function paintGround(){
  ctx.fillStyle='#62a655';ctx.fillRect(0,0,WW,WH);
  ctx.fillStyle='#5a9c4e';for(let i=0;i<90;i++){const x=(Math.sin(i*91.7)*.5+.5)*WW,y=(Math.sin(i*37.3)*.5+.5)*WH;ctx.beginPath();ctx.arc(x,y,16+i%4*7,0,7);ctx.fill()}
  MCEN.forEach((c,m)=>{ctx.beginPath();ctx.arc(c.x,c.y,730,0,7);ctx.fillStyle='hsla('+(m*60+10)+',55%,60%,.22)';ctx.fill();ctx.setLineDash([22,16]);ctx.lineWidth=5;ctx.strokeStyle='hsla('+(m*60+10)+',70%,40%,.55)';ctx.stroke();ctx.setLineDash([])});
  ctx.lineCap='round';ctx.strokeStyle='#e8dfc8';ctx.lineWidth=34;ctx.beginPath();ctx.arc(CX,CY,RR,0,7);ctx.stroke();
  MCEN.forEach(c=>{ctx.beginPath();ctx.moveTo(CX,CY);ctx.lineTo(c.x,c.y);ctx.stroke()});ctx.lineCap='butt';
  ctx.beginPath();ctx.arc(CX,CY,340,0,7);ctx.fillStyle='#efe6cf';ctx.fill();ctx.lineWidth=10;ctx.strokeStyle='#d4c8a6';ctx.stroke();
  ctx.beginPath();ctx.arc(CX,CY,250,0,7);ctx.lineWidth=4;ctx.setLineDash([14,12]);ctx.strokeStyle='#c9bb94';ctx.stroke();ctx.setLineDash([]);
  ctx.save();ctx.font='800 20px system-ui,sans-serif';ctx.textAlign='center';const sm='🏙 SHAHAR MARKAZI',sw=ctx.measureText(sm).width+30;
  ctx.fillStyle='#fff';rr(CX-sw/2,CY+205,sw,34,17);ctx.fill();ctx.fillStyle='#1b1b1b';ctx.fillText(sm,CX,CY+228);ctx.restore();
  MCEN.forEach((c,m)=>{ctx.beginPath();ctx.arc(c.x,c.y,215,0,7);ctx.fillStyle='#efe6cf';ctx.fill();ctx.lineWidth=6;ctx.strokeStyle='#d4c8a6';ctx.stroke()});
  TREES.forEach(t=>{ctx.fillStyle='rgba(0,0,0,.12)';ctx.beginPath();ctx.ellipse(t.x+4,t.y+t.r*.7,t.r,t.r*.4,0,0,7);ctx.fill();ctx.fillStyle='#6b4a2b';ctx.fillRect(t.x-3,t.y,6,t.r*.8);ctx.fillStyle='#3f9440';ctx.beginPath();ctx.arc(t.x,t.y-t.r*.3,t.r,0,7);ctx.fill();ctx.fillStyle='#4aa84b';ctx.beginPath();ctx.arc(t.x-t.r*.3,t.y-t.r*.5,t.r*.55,0,7);ctx.fill()});
}
let gcache=null;
function buildGround(){try{const c=document.createElement('canvas'),GS=.4;c.width=Math.round(WW*GS);c.height=Math.round(WH*GS);const g=c.getContext('2d');if(!g)return;
  ctx=g;ctx.setTransform(GS,0,0,GS,0,0);paintGround();ctx=mainCtx;gcache=c}catch(e){ctx=mainCtx;gcache=null}}
function drawGround(){if(!gcache)buildGround();if(gcache)ctx.drawImage(gcache,0,0,WW,WH);else paintGround();MCEN.forEach((c,m)=>drawMahalla(c,m))}
function drawHouseLite(h){const c=cellOf(h.slot),hue=h.hue,hh=h.fl?h.fl*30:55,x=c.cx-95,y=c.top+200;
  ctx.fillStyle='hsl('+hue+',30%,80%)';ctx.fillRect(x-50,y-hh,100,hh);
  ctx.fillStyle='hsl('+hue+',55%,34%)';ctx.beginPath();ctx.moveTo(x-58,y-hh);ctx.lineTo(x,y-hh-(h.fl?10:45));ctx.lineTo(x+58,y-hh);ctx.fill();
  if(h.id===me){ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(x,y+30,16,0,7);ctx.fill()}
  (h.biz||[]).forEach((k,i)=>{ctx.fillStyle=BIZ[k].c;ctx.fillRect(c.cx+66,c.top+28+i*62,86,50)})}
function drawHouse(h,t){
  if(cam.z<.32){drawHouseLite(h);return}
  const {cx,top}=cellOf(h.slot),s=100,bx=cx-95,by=top+200,hue=h.hue,isMe=h.id===me,isSel=h.id===sel,glow=isSel?22:0;
  ctx.save();ctx.lineJoin='round';ctx.lineWidth=2;
  ctx.fillStyle='rgba(0,0,0,.12)';ctx.beginPath();ctx.ellipse(bx+10,by+4,s*.7,9,0,0,7);ctx.fill();
  if(glow){ctx.shadowColor='hsl('+hue+',100%,60%)';ctx.shadowBlur=glow}
  if(h.fl){
    const fh=30,HH=h.fl*fh,fx=bx-52,fw=82;
    poly([[fx+fw,by],[fx+fw+26,by-6],[fx+fw+26,by-HH-6],[fx+fw,by-HH]],'hsl('+hue+',30%,66%)');

  const pk=el('div','Har daraja mahalla aʼzolari daromadiga +5% beradi. Hozir: +'+(lv*5)+'%.');pk.style.cssText='color:#8b93c4;font-size:13px;margin-top:6px';w.appendChild(pk);
  const h=M();
  if(h){const mine=donDocs.filter(d=>d.from===me&&d.m===m).reduce((s,d)=>s+d.amt,0),row=el('div');row.style.cssText='display:flex;gap:8px;flex-wrap:wrap;margin-top:12px';
    [100,500,2000].forEach(a=>{const b=el('button','💝 '+fmt(a)+' DD','gold');b.disabled=h.dd<a||!nx;b.onclick=()=>donate(m,a);row.appendChild(b)});w.appendChild(row);
    const mi=el('div','Sizning hissangiz: '+fmt(mine)+' DD'+(mahOf(h)===m?' · bu sizning mahallangiz':''));mi.style.cssText='margin-top:8px;font-size:13px';w.appendChild(mi)}
  const hd=el('div','Aʼzolar');hd.style.cssText='margin-top:12px;font-weight:700';w.appendChild(hd);
  mem.slice(0,10).forEach(x=>{const it=el('div','','lb'+(x.id===me?' me':''));it.appendChild(el('span','@'+x.u));it.appendChild(el('b',fmt(worth(x))+' DD'));
    it.onclick=()=>{const c=cellOf(x.slot);cam.x=c.cx;cam.y=c.top+150;cam.z=Math.max(.9,W/520);clampCam();sel=x.id;closeM()};w.appendChild(it)});
  if(!mem.length)w.appendChild(el('div','Bu mahallada hali uycha yoʻq.'));
  closeBtn(w);modal(w)}

// Taklif (Telegram)
function refId(){try{const tg=window.Telegram&&Telegram.WebApp,sp=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param)||new URLSearchParams(location.search).get('ref')||'';return sp.indexOf('ref_')===0?sp.slice(4):''}catch(e){return ''}}
function inviteLink(){const base=window.TG_LINK||location.href.split('#')[0].split('?')[0];if(!window.TG_LINK||!me)return base;let one=false;try{one=new URL(base).pathname.split('/').filter(Boolean).length===1}catch(e){}return base+(one?'?start=ref_':'?startapp=ref_')+me}
$('bT').onclick=()=>{const link=inviteLink(),text='🏠 Neon Shahar — username yoz, uychangni qur, ek, sot, biznes och! Qoʻshil va bonus ol:',tg=window.Telegram&&Telegram.WebApp;
  if(tg&&tg.initData&&tg.openTelegramLink){tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(link)+'&text='+encodeURIComponent(text))}
  else if(navigator.share){navigator.share({title:'Neon Shahar',text,url:link}).catch(()=>{})}
  else{try{navigator.clipboard.writeText(link);toast('📋 Havola nusxalandi')}catch(e){toast(link,6000)}}}

// Almashtirish
$('bX').onclick=()=>{const h=M(),w=shell('🔁 Almashtirish','10 tanga = 1 DeDosent'),n=Math.floor(h.coins/RATE);
  const b=el('button',n?('Hammasini almashtirish: '+n*RATE+' tanga → '+n+' DD'):'Tanga yetarli emas (kamida 10)','gold');b.style.cssText='width:100%;margin-top:12px';b.disabled=!n;
  b.onclick=()=>{const x=M();x.coins-=n*RATE;x.dd=r1(x.dd+n);save(x);closeM()};w.appendChild(b);closeBtn(w);modal(w)};
$('modal').onclick=e=>{if(e.target===$('modal'))closeM()};

// uycha yaratish — joy avtomatik
function create(){const u=clean($('u').value);if(u.length<2){$('u').focus();return}
  const id=idOf(u),old=houses.get(id);
  const h=old||{id,u,slot:freeSlot(u),hue:hueOf(u),dd:3,coins:0,car:false,biz:[],last:Date.now(),gd:0,pl:[],wh:0,fl:0,inv:{bugdoy:0,pomidor:0,paxta:0,uzum:0},pk:['bugdoy','bugdoy','bugdoy','bugdoy'],sd:0,kz:0,gk:0,gb:0,dl:'',st:0,tk:null,sl:0};
  if(!old){const ref=refId();if(ref&&ref!==id&&db){h.dd=r1(h.dd+200);db.collection('sales').doc().set({to:ref,from:id,amt:300,item:'Taklif',ts:Date.now()}).catch(()=>{});setTimeout(()=>toast('🎁 Taklif bonusi: +200 DD',4000),300)}}
  me=id;sel=id;try{localStorage.setItem('neon_me',u)}catch(e){}
  $('go').textContent='Yangilash';save(h);home()}
$('go').onclick=create;$('u').addEventListener('keydown',e=>{if(e.key==='Enter')create()});

// umumiy baza
let saved='';try{saved=localStorage.getItem('neon_me')||''}catch(e){}
if(saved)$('u').value=saved;
{const tg=window.Telegram&&Telegram.WebApp;if(tg&&tg.initData){try{tg.ready();tg.expand();if(tg.setHeaderColor)tg.setHeaderColor('#070a1a');if(tg.setBackgroundColor)tg.setBackgroundColor('#070a1a');if(tg.disableVerticalSwipes)tg.disableVerticalSwipes()}catch(e){}
  if(!saved&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.username)$('u').value=tg.initDataUnsafe.user.username.toLowerCase()}}
function loadLocal(){try{const o=JSON.parse(localStorage.getItem('neon_house')||'null');return o&&o.u?norm(idOf(o.u),o):null}catch(e){return null}}
const norm=(id,v)=>({id,u:v.u,slot:((v.slot||0)%N+N)%N,hue:v.hue,dd:v.dd||0,coins:v.coins||0,car:!!v.car,biz:v.biz||[],last:v.last||Date.now(),gd:v.gd||0,pl:(v.pl&&v.pl.length===4)?v.pl:[0,0,0,0],wh:0,fl:v.fl||0,inv:Object.assign({bugdoy:0,pomidor:0,paxta:0,uzum:0},v.inv||{},{bugdoy:((v.inv&&v.inv.bugdoy)||0)+(v.wh||0)}),pk:(v.pk&&v.pk.length===4)?v.pk:['bugdoy','bugdoy','bugdoy','bugdoy'],sd:v.sd||0,kz:v.kz||0,gk:v.gk||0,gb:v.gb||0,dl:v.dl||'',st:v.st||0,tk:v.tk||null,sl:v.sl||0});
function startDb(){
  db.collection('houses').onSnapshot(s=>{houses.clear();s.docs.forEach(d=>{const v=typeof d.data==='function'?d.data():d.data;if(v&&v.u)houses.set(d.id,norm(d.id,v))});
    if(me&&!houses.has(me)){const l=loadLocal();if(l&&l.id===me){houses.set(me,l);save(l)}}
    if(!me&&saved&&houses.has(idOf(saved))){me=idOf(saved);home()}render();claimSales()},()=>{});
  db.collection('links').onSnapshot(s=>{links=s.docs.map(d=>{const v=typeof d.data==='function'?d.data():d.data;return{id:d.id,a:v.a,b:v.b}});render()},()=>{});
  db.collection('sales').onSnapshot(s=>{salesDocs=s.docs.map(d=>{const v=typeof d.data==='function'?d.data():d.data;return{id:d.id,to:v&&v.to,amt:(v&&v.amt)||0}});claimSales()},()=>{});
  db.collection('donations').onSnapshot(s=>{donDocs=s.docs.map(d=>{const v=typeof d.data==='function'?d.data():d.data;return{id:d.id,m:v&&v.m,from:v&&v.from,amt:(v&&v.amt)||0}});
    fund=[0,0,0,0,0,0];donDocs.forEach(d=>{if(d.m>=0&&d.m<MAH)fund[d.m]+=d.amt});render()},()=>{});
  mode='shared';render()}
try{if(window.FIREBASE_CONFIG){const ld=u=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=u;e.onload=ok;e.onerror=no;document.head.appendChild(e)});
  ld('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js').then(()=>ld('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js')).then(()=>{firebase.initializeApp(window.FIREBASE_CONFIG);db=firebase.firestore();startDb()}).catch(()=>{})}
  else if(window.claude&&claude.use)claude.use('db').then(d=>{if(d){db=d;startDb()}}).catch(()=>{})}catch(e){}
{const l=loadLocal();if(l&&!houses.has(l.id)){houses.set(l.id,l);me=l.id;$('go').textContent='Yangilash'}}
const EVENTS=[
 {w:3,run:x=>{const g=40+Math.floor(Math.random()*80);x.dd=r1(x.dd+g);return '🎉 Mehmonlar keldi! Choy-non uchun +'+g+' DD'}},
 {w:3,run:x=>{x.sl=Date.now()+180000;return '🛍 Bozorda aksiya! 3 daqiqa ekin narxlari ×1.25'}},
 {w:2,run:x=>{if(!(x.pl||[]).some(t=>t))return null;x.pl=x.pl.map(t=>t?t-30000:0);return '☀️ Ekinlar yaxshi oʻsdi: pishishi 30 soniya yaqinlashdi'}},
 {w:2,run:x=>{if(x.car)return '🕵️ Oʻgʻri kirmoqchi boʻldi, lekin mashinangiz bilan quvib yetdingiz!';const l=Math.min(300,Math.floor(x.dd*.02));if(l<1)return null;x.dd=r1(x.dd-l);return '🕵️ Oʻgʻri tushdi! −'+l+' DD (mashina boʻlsa himoya qiladi)'}},
 {w:2,run:x=>{x.coins+=15;return '🪙 Koʻchada tanga topdingiz: +15 tanga'}}
];
function fireEvent(){const x=M();if(!x||document.hidden||$('modal').style.display==='flex')return;
  const pool=EVENTS.slice();let msg=null;
  while(pool.length&&!msg){const tot=pool.reduce((a,e)=>a+e.w,0);let r=Math.random()*tot,i=0;while(i<pool.length-1&&r>pool[i].w){r-=pool[i].w;i++}msg=pool.splice(i,1)[0].run(x)}
  if(msg){save(x);toast(msg,5000)}}
setInterval(()=>{if(Math.random()<.09)fireEvent()},20000);
home();render();
})();
